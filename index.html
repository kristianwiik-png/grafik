<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Lower Third</title>

<style>
body {
    margin: 0;
    background: transparent;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: Arial;
}

.box {
    position: absolute;
    left: 80px;
    bottom: 80px;
    width: 1600px;
    height: 200px;
    background: rgba(20,20,20,0.9);
    border-radius: 20px;
    display: flex;
    align-items: center;
    padding: 40px;
}

.text {
    flex: 1;
}

.name {
    font-size: 64px;
    color: white;
    font-weight: bold;
}

.title {
    font-size: 36px;
    color: #ccc;
}

.logo img {
    max-height: 140px;
    max-width: 260px;
}
</style>
</head>

<body>

<div class="box">
    <div class="text">
        <!-- ✍️ SKRIV MANUELLT HÄR -->
        <div class="name">Anna Svensson</div>
        <div class="title">Projektledare</div>
    </div>

    <div class="logo">
        <img src="logo.png">
    </div>
</div>

</body>
</html>
